name: Build Baiyun Kernel Ace3Pro
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          fetch-depth: 0

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev

      - name: Download Toolchain
        run: |
          mkdir toolchain
          cd toolchain
          # 使用谷歌官方针对安卓 14/15 优化的 Clang 编译器
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -xf clang-r522817.tar.gz

      - name: Compile Kernel
        run: |
          # 1. 设置环境变量
          export PATH=$(pwd)/toolchain/bin:$PATH
          
          # 2. 生成配置（注意：这里已经删除了 cd common，直接在根目录运行）
          make O=out ARCH=arm64 gki_defconfig
          
          # 3. 开始炼制
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1

      - name: Pack and Upload
        uses: actions/upload-artifact@v4
        with:
          name: Baiyun-Kernel-Ace3Pro-Image
          # 修正后的产物路径
          path: out/arch/arm64/boot/Image
